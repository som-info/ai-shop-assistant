services:
  assistant:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DATABASE_URL: sqlite:////srv/data/shop.db
    volumes:
      - shop-data:/srv/data
    restart: unless-stopped
volumes:
  shop-data:
